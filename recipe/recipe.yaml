schema_version: 1

context:
  name: dtool_tag
  version: "0.1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/dtool-tag/dtool-tag-${{ version }}.tar.gz
  sha256: f3a4e85d770c23c2d4aa48294fd5bb6aaf204d69340c9c103b236ffe51ee2fd4

build:
  number: 4
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - click
    - dtool_cli
    - dtoolcore >=3.17.0
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dtool_tag
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: MIT
  license_file: LICENSE.rst
  summary: dtool CLI commands for working with tags
  description: |
    dtool CLI commands for working with tags
  homepage: https://github.com/jic-dtool/dtool-tag
  repository: https://github.com/jic-dtool/dtool-tag
  documentation: https://github.com/jic-dtool/dtool-tag

extra:
  recipe-maintainers:
    - jan-janssen
    - tjelvar-olsson
